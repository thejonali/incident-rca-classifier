[project]
name = "incident-rca-classifier"
version = "0.1.0"
description = "GRU/LSTM incident root-cause classifier with a workflow-routing demo on a synthetic RCA dataset"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/thejonali/incident-rca-classifier"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_data_classification = ["samples/*.json"]
